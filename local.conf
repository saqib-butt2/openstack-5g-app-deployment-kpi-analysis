# local.conf
# DevStack configuration file
# Individual deployment on MacBook M5 — UTM VM — Ubuntu 24.04 LTS

[[local|localrc]]

# Host IP of Ubuntu VM inside UTM
HOST_IP=192.168.64.26

# Use QEMU instead of KVM — required for nested virtualisation on Apple Silicon
LIBVIRT_TYPE=qemu

# Passwords — development environment only
ADMIN_PASSWORD=secret
DATABASE_PASSWORD=secret
RABBIT_PASSWORD=secret
SERVICE_PASSWORD=secret

# Enable core services
enable_service n-cpu
enable_service n-cond
enable_service n-sch
enable_service placement-api
enable_service q-svc
enable_service q-agt
enable_service q-dhcp
enable_service q-l3
enable_service q-meta
enable_service horizon
enable_service cinder
