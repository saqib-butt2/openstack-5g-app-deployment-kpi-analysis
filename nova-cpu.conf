# nova-cpu.conf
# Nova CPU configuration for ARM64 — Apple Silicon MacBook M5
# Required to fix host-passthrough CPU error in nested virtualisation environment

[libvirt]
# Use custom CPU mode instead of host-passthrough
# host-passthrough requires KVM which is unavailable inside UTM on Apple Silicon
cpu_mode = custom

# cortex-a57 is a compatible ARM64 CPU model supported by QEMU
cpu_model = cortex-a57

# Use QEMU as virtualisation type instead of KVM
virt_type = qemu
